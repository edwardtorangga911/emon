<!DOCTYPE HTML>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#111827">
  <title>Boxed 2D Physics Action Game - Edward Torangga</title>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.7.2/css/all.css">

  <style type="text/css">
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      min-height: 100vh;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    /* Top Bar Navigation */
    .top-nav {
      width: 100%;
      max-width: 900px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 100;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
      color: #38bdf8;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
    }

    .back-btn:hover {
      background: #0284c7;
      color: #fff;
      transform: translateY(-2px);
    }

    .game-title-header {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .highscore-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fbbf24;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 9999px;
    }

    /* Main Game Layout Container */
    .game-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 860px;
      padding: 10px 16px;
      flex: 1;
    }

    #canvas-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 800 / 550;
      background: #111;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(56, 189, 248, 0.2);
    }

    #main {
      width: 100% !important;
      height: 100% !important;
      display: block;
      cursor: crosshair;
    }

    /* Controls Bar & Hints */
    .controls-hint {
      margin-top: 14px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
      line-height: 1.6;
    }

    .kbd {
      display: inline-block;
      padding: 2px 7px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      color: #fff;
      font-family: monospace;
      font-size: 11px;
      font-weight: bold;
    }

    /* Mobile Virtual Touch Controls */
    .virtual-controls {
      display: none;
      width: 100%;
      max-width: 500px;
      margin-top: 14px;
      padding: 0 10px;
      justify-content: space-between;
      user-select: none;
      -webkit-user-select: none;
    }

    .v-pad-group {
      display: flex;
      gap: 12px;
    }

    .v-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 2px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
      transition: background 0.1s, transform 0.1s;
    }

    .v-btn:active, .v-btn.pressed {
      background: rgba(56, 189, 248, 0.5);
      border-color: #38bdf8;
      transform: scale(0.92);
    }

    .v-btn.action-jump {
      background: rgba(16, 185, 129, 0.25);
      border-color: rgba(16, 185, 129, 0.5);
      color: #34d399;
    }

    .v-btn.action-jump:active {
      background: #10b981;
      color: #fff;
    }

    .v-btn.action-shoot {
      background: rgba(239, 68, 68, 0.25);
      border-color: rgba(239, 68, 68, 0.5);
      color: #f87171;
    }

    .v-btn.action-shoot:active {
      background: #ef4444;
      color: #fff;
    }

    @media (max-width: 820px) {
      .virtual-controls {
        display: flex;
      }
      .top-nav {
        padding: 10px 14px;
      }
      .game-title-header {
        display: none;
      }
    }
  </style>

  <!-- Prevent canvas reparenting to outside wrapper -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const origAppend = document.body.appendChild;
      document.body.appendChild = function(child) {
        if (child && child.id === "main") {
          const container = document.getElementById("canvas-container");
          if (container) {
            container.appendChild(child);
            return child;
          }
        }
        return origAppend.call(document.body, child);
      };
    });
  </script>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="top-nav">
    <a href="/" class="back-btn" title="Kembali ke emon.my.id">
      <i class="fas fa-arrow-left"></i>
      <span>Portfolio</span>
    </a>

    <div class="game-title-header">
      <i class="fas fa-cube" style="color: #38bdf8;"></i>
      <span>Boxed 2D Physics</span>
    </div>

    <div class="highscore-badge">
      <i class="fas fa-trophy"></i>
      <span>Skor Tertinggi: <span id="score">0</span></span>
    </div>
  </header>

  <!-- Game Main Screen -->
  <main class="game-wrapper">
    <div id="canvas-container">
      <canvas id="main" width="800" height="550"></canvas>
    </div>

    <!-- Desktop Controls Hint -->
    <div class="controls-hint">
      <strong>Kontrol Keyboard:</strong>
      <span class="kbd">A</span> / <span class="kbd">D</span> atau <span class="kbd">←</span> <span class="kbd">→</span> Jalan &bull; 
      <span class="kbd">W</span> / <span class="kbd">Spasi</span> / <span class="kbd">↑</span> Lompat &bull; 
      <span class="kbd">X</span> / <span class="kbd">Shift</span> / <span class="kbd">Klik Mouse</span> Tembak
    </div>

    <!-- Mobile Virtual Gamepad -->
    <div class="virtual-controls" aria-label="Kontrol Virtual Layar Sentuh">
      <div class="v-pad-group">
        <button type="button" class="v-btn" id="btn-left" aria-label="Kiri">
          <i class="fas fa-chevron-left"></i>
        </button>
        <button type="button" class="v-btn" id="btn-right" aria-label="Kanan">
          <i class="fas fa-chevron-right"></i>
        </button>
      </div>

      <div class="v-pad-group">
        <button type="button" class="v-btn action-jump" id="btn-jump" aria-label="Lompat">
          <i class="fas fa-arrow-up"></i>
        </button>
        <button type="button" class="v-btn action-shoot" id="btn-shoot" aria-label="Tembak">
          <i class="fas fa-crosshairs"></i>
        </button>
      </div>
    </div>
  </main>

  <!-- Virtual Controls Script -->
  <script>
    function bindVirtualKey(btnId, keyCode, key, code) {
      const btn = document.getElementById(btnId);
      if (!btn) return;

      const trigger = (type) => {
        const ev = new KeyboardEvent(type, {
          key: key,
          code: code,
          keyCode: keyCode,
          which: keyCode,
          bubbles: true,
          cancelable: true
        });
        window.dispatchEvent(ev);
        document.dispatchEvent(ev);
      };

      // Touch events
      btn.addEventListener("touchstart", (e) => {
        e.preventDefault();
        btn.classList.add("pressed");
        trigger("keydown");
      }, { passive: false });

      btn.addEventListener("touchend", (e) => {
        e.preventDefault();
        btn.classList.remove("pressed");
        trigger("keyup");
      }, { passive: false });

      btn.addEventListener("touchcancel", (e) => {
        btn.classList.remove("pressed");
        trigger("keyup");
      });

      // Mouse fallback
      btn.addEventListener("mousedown", (e) => {
        e.preventDefault();
        btn.classList.add("pressed");
        trigger("keydown");
      });

      btn.addEventListener("mouseup", (e) => {
        e.preventDefault();
        btn.classList.remove("pressed");
        trigger("keyup");
      });

      btn.addEventListener("mouseleave", () => {
        if (btn.classList.contains("pressed")) {
          btn.classList.remove("pressed");
          trigger("keyup");
        }
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      bindVirtualKey("btn-left", 37, "ArrowLeft", "ArrowLeft");
      bindVirtualKey("btn-right", 39, "ArrowRight", "ArrowRight");
      bindVirtualKey("btn-jump", 32, " ", "Space");
      bindVirtualKey("btn-shoot", 88, "x", "KeyX");
    });
  </script>

  <!-- Load Game Engine Bundle -->
  <script src="bundle.js" type="text/javascript"></script>
</body>
</html>
