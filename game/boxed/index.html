<!DOCTYPE HTML>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <title>Boxed 2D Physics - Edward Torangga</title>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.7.2/css/all.css">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at 50% 25%, #1e293b 0%, #090d16 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* Top Navigation Bar */
    .top-nav {
      height: 54px;
      flex-shrink: 0;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(15, 23, 42, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 50;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 9999px;
      color: #38bdf8;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: #0284c7;
      color: #fff;
      transform: translateX(-2px);
    }

    .game-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #f1f5f9;
    }

    .game-title i {
      color: #38bdf8;
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6));
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .highscore-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fbbf24;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 9999px;
    }

    .fs-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #cbd5e1;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      transition: all 0.2s;
    }

    .fs-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    /* Game Stage */
    .game-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      min-height: 0;
      width: 100%;
    }

    #canvas-container {
      position: relative;
      /* Keep aspect ratio 800:550 while fitting inside available viewport */
      width: min(96vw, calc((100dvh - 170px) * (800 / 550)), 800px);
      aspect-ratio: 800 / 550;
      background: #1e191d;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 35px rgba(56, 189, 248, 0.2);
    }

    #main {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      display: block;
      cursor: crosshair;
    }

    /* Desktop Controls Hint */
    .controls-hint {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 8px;
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
    }

    .hint-group {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .kbd {
      display: inline-block;
      padding: 2px 6px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      color: #fff;
      font-family: monospace;
      font-size: 11px;
      font-weight: 700;
    }

    /* Mobile Virtual Touch Gamepad */
    .virtual-gamepad {
      display: none;
      width: 100%;
      max-width: 520px;
      margin-top: 6px;
      padding: 0 12px;
      justify-content: space-between;
      align-items: center;
      z-index: 40;
    }

    .v-pad-cluster {
      display: flex;
      gap: 12px;
    }

    .v-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 2px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
      transition: background 0.1s, transform 0.08s;
      -webkit-tap-highlight-color: transparent;
    }

    .v-btn:active, .v-btn.pressed {
      background: rgba(56, 189, 248, 0.55);
      border-color: #38bdf8;
      transform: scale(0.92);
    }

    .v-btn.btn-jump {
      background: rgba(16, 185, 129, 0.25);
      border-color: rgba(16, 185, 129, 0.5);
      color: #34d399;
    }

    .v-btn.btn-jump:active, .v-btn.btn-jump.pressed {
      background: #10b981;
      color: #fff;
    }

    .v-btn.btn-shoot {
      background: rgba(239, 68, 68, 0.25);
      border-color: rgba(239, 68, 68, 0.5);
      color: #f87171;
    }

    .v-btn.btn-shoot:active, .v-btn.btn-shoot.pressed {
      background: #ef4444;
      color: #fff;
    }

    @media (max-width: 820px), (pointer: coarse) {
      .virtual-gamepad {
        display: flex;
      }
      .controls-hint {
        display: none;
      }
      .game-title {
        display: none;
      }
      #canvas-container {
        width: min(98vw, calc((100dvh - 140px) * (800 / 550)), 800px);
      }
    }
  </style>

  <!-- Prevent canvas from reparenting away from #canvas-container -->
  <script>
    (function() {
      const origAppend = document.body.appendChild;
      document.body.appendChild = function(child) {
        if (child && child.id === "main") {
          const container = document.getElementById("canvas-container");
          if (container && child.parentNode !== container) {
            container.appendChild(child);
            return child;
          }
          return child;
        }
        return origAppend.call(document.body, child);
      };
    })();
  </script>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="top-nav">
    <a href="/" class="back-btn" title="Kembali ke emon.my.id">
      <i class="fas fa-arrow-left"></i>
      <span>Portfolio</span>
    </a>

    <div class="game-title">
      <i class="fas fa-cube"></i>
      <span>Boxed 2D Physics</span>
    </div>

    <div class="nav-actions">
      <div class="highscore-badge">
        <i class="fas fa-trophy"></i>
        <span>Skor: <strong id="score">0</strong></span>
      </div>
      <button type="button" class="fs-btn" id="btn-fullscreen" title="Layar Penuh">
        <i class="fas fa-expand"></i>
      </button>
    </div>
  </header>

  <!-- Main Game Stage -->
  <main class="game-stage">
    <div id="canvas-container">
      <canvas id="main" width="800" height="550"></canvas>
    </div>

    <!-- Desktop Controls Hint -->
    <footer class="controls-hint">
      <span class="hint-group">
        <span class="kbd">A</span> / <span class="kbd">D</span> atau <span class="kbd">←</span> <span class="kbd">→</span> Gerak
      </span>
      &bull;
      <span class="hint-group">
        <span class="kbd">W</span> / <span class="kbd">Spasi</span> Lompat
      </span>
      &bull;
      <span class="hint-group">
        <span class="kbd">X</span> / <span class="kbd">Klik Kiri</span> Tembak
      </span>
      &bull;
      <span class="hint-group">
        <i class="fas fa-mouse-pointer" style="margin-right: 2px;"></i> Klik Kanvas untuk Kunci Bidikan
      </span>
    </footer>

    <!-- Mobile Virtual Gamepad -->
    <div class="virtual-gamepad" aria-label="Kontrol Virtual Layar Sentuh">
      <div class="v-pad-cluster">
        <button type="button" class="v-btn" id="btn-left" aria-label="Kiri">
          <i class="fas fa-chevron-left"></i>
        </button>
        <button type="button" class="v-btn" id="btn-right" aria-label="Kanan">
          <i class="fas fa-chevron-right"></i>
        </button>
      </div>

      <div class="v-pad-cluster">
        <button type="button" class="v-btn btn-jump" id="btn-jump" aria-label="Lompat">
          <i class="fas fa-arrow-up"></i>
        </button>
        <button type="button" class="v-btn btn-shoot" id="btn-shoot" aria-label="Tembak">
          <i class="fas fa-crosshairs"></i>
        </button>
      </div>
    </div>
  </main>

  <!-- Fullscreen Toggle & Virtual Gamepad Controller -->
  <script>
    // Fullscreen Toggle
    const fsBtn = document.getElementById("btn-fullscreen");
    if (fsBtn) {
      fsBtn.addEventListener("click", () => {
        if (!document.fullscreenElement) {
          const target = document.documentElement;
          if (target.requestFullscreen) target.requestFullscreen();
          else if (target.webkitRequestFullscreen) target.webkitRequestFullscreen();
          fsBtn.innerHTML = '<i class="fas fa-compress"></i>';
        } else {
          if (document.exitFullscreen) document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
          fsBtn.innerHTML = '<i class="fas fa-expand"></i>';
        }
      });
      document.addEventListener("fullscreenchange", () => {
        fsBtn.innerHTML = document.fullscreenElement 
          ? '<i class="fas fa-compress"></i>' 
          : '<i class="fas fa-expand"></i>';
      });
    }

    // Touch / Button key binding
    function bindVirtualKey(btnId, keyCode, key, code) {
      const btn = document.getElementById(btnId);
      if (!btn) return;

      const trigger = (type) => {
        const ev = new KeyboardEvent(type, {
          key: key,
          code: code,
          keyCode: keyCode,
          which: keyCode,
          bubbles: true,
          cancelable: true
        });
        window.dispatchEvent(ev);
        document.dispatchEvent(ev);
      };

      btn.addEventListener("touchstart", (e) => {
        e.preventDefault();
        btn.classList.add("pressed");
        trigger("keydown");
      }, { passive: false });

      btn.addEventListener("touchend", (e) => {
        e.preventDefault();
        btn.classList.remove("pressed");
        trigger("keyup");
      }, { passive: false });

      btn.addEventListener("touchcancel", (e) => {
        btn.classList.remove("pressed");
        trigger("keyup");
      });

      btn.addEventListener("mousedown", (e) => {
        e.preventDefault();
        btn.classList.add("pressed");
        trigger("keydown");
      });

      btn.addEventListener("mouseup", (e) => {
        e.preventDefault();
        btn.classList.remove("pressed");
        trigger("keyup");
      });

      btn.addEventListener("mouseleave", () => {
        if (btn.classList.contains("pressed")) {
          btn.classList.remove("pressed");
          trigger("keyup");
        }
      });
    }

    bindVirtualKey("btn-left", 37, "ArrowLeft", "ArrowLeft");
    bindVirtualKey("btn-right", 39, "ArrowRight", "ArrowRight");
    bindVirtualKey("btn-jump", 32, " ", "Space");
    bindVirtualKey("btn-shoot", 88, "x", "KeyX");
  </script>

  <!-- Load Game Engine Bundle with cache buster -->
  <script src="bundle.js?v=2.0.3" type="text/javascript"></script>
</body>
</html>
